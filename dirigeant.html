<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace dirigeant — Portail de pointage</title>
<link rel="stylesheet" href="assets/style.css?v=7">
</head>
<body>
<header class="tete">
  <div class="enveloppe">
    <img id="logo" alt="" class="cache">
    <h1 id="nomEtab">Espace dirigeant</h1>
    <span class="qui" id="qui"></span>
    <button class="bouton discret petit" id="deco">Se déconnecter</button>
  </div>
  <nav class="onglets enveloppe" role="tablist" id="onglets">
    <button role="tab" data-o="aujourdhui" aria-selected="true">Aujourd'hui</button>
    <button role="tab" data-o="planning">Planning</button>
    <button role="tab" data-o="pointages">Pointages</button>
    <button role="tab" data-o="alertes">Retards et absences <span class="pastille cache" id="nbAl"></span></button>
    <button role="tab" data-o="demandes">Congés et demandes <span class="pastille cache" id="nbDem"></span></button>
    <button role="tab" data-o="messages">Messages</button>
    <button role="tab" data-o="equipe">Équipe</button>
    <button role="tab" data-o="journal">Journal</button>
    <button role="tab" data-o="reglages">Réglages</button>
  </nav>
</header>
<main class="enveloppe"><div class="pile" id="vue"><p class="doux">Chargement…</p></div></main>

<script src="assets/config.js?v=7"></script>
<script src="assets/sb.js?v=7"></script>
<script src="assets/commun.js?v=7"></script>
<script src="assets/releve.js?v=7"></script>
<script>
(async function () {
  const { $, esc, heure, dateCourte, dateLongue, ajouterJours, lundi, aujourdhui, hm, duree, messageErreur, toast, formulaire, fenetre } = P;
  const ctx = await P.garde(['dirigeant']);
  if (!ctx) return;
  const etabId = ctx.membre.etab_id;
  let etab = ctx.etab;
  try { const [e0] = await sb.lire('etablissements', { select: '*', id: 'eq.' + etabId }); if (e0) etab = e0; } catch (e) { /* */ }
  const reg = () => etab.reglages || {};
  const majEntete = () => {
    $('#nomEtab').textContent = etab.nom;
    const l = reg().logo; $('#logo').classList.toggle('cache', !l); if (l) $('#logo').src = l;
    P.appliquerIdentite(etab);
  };
  majEntete();
  $('#qui').textContent = (ctx.user.user_metadata && ctx.user.user_metadata.nom) || ctx.user.email;
  $('#deco').onclick = async () => { await sb.deconnexion(); location.replace('index.html'); };
  const params = new URLSearchParams(location.search);
  let onglet = params.get('onglet') || 'aujourdhui';
  let semaine = lundi(aujourdhui());
  let periode = { du: lundi(aujourdhui()), au: ajouterJours(lundi(aujourdhui()), 6) }, filtreSal = '';
  let filtreDem = 'attente', filtreAl = 'traiter';
  const choisirOnglet = o => { onglet = o; document.querySelectorAll('#onglets button').forEach(x => x.setAttribute('aria-selected', x.dataset.o === o)); afficher(); };
  document.querySelectorAll('#onglets button').forEach(b => b.onclick = () => choisirOnglet(b.dataset.o));
  document.querySelectorAll('#onglets button').forEach(x => x.setAttribute('aria-selected', x.dataset.o === onglet));
  const retour = () => new URL('activer.html', location.href).href;
  const tol = () => +(reg().tolerance_min ?? 5);
  const POSTES = () => (reg().postes && reg().postes.length ? reg().postes : ['Salle', 'Cuisine', 'Pizzaiolo', 'Plonge', 'Caisse', 'Encadrement']);
  const TYPES_CONGE = R.LEAVE_TYPES;
  const nomS = s => s ? `${s.prenom} ${s.nom || ''}`.trim() : 'Salarié inconnu';
  const fmtH = R.fmtH;
  const lien = c => `<a href="#" data-doc="${esc(c.chemin)}">${esc(c.nom)}</a>`;
  const brancherDocs = () => document.querySelectorAll('[data-doc]').forEach(l => l.onclick = async e => { e.preventDefault(); try { window.open(await sb.lienTemporaire(l.dataset.doc, 300), '_blank', 'noopener'); } catch (er) { toast(messageErreur(er)); } });
  const horodatageParis = (iso, hhmm) => new Date(R.instant(iso, hhmm)).toISOString();

  async function compteurs() {
    try {
      const d = await sb.lire('demandes', { select: 'id', etab_id: 'eq.' + etabId, statut: 'eq.attente' });
      const a = await sb.lire('alertes', { select: 'id,a_reexaminer,statut,annulee,type,maintenue', etab_id: 'eq.' + etabId, annulee: 'eq.false' });
      const n = a.filter(aTraiter).length;
      $('#nbDem').textContent = d.length; $('#nbDem').classList.toggle('cache', !d.length);
      $('#nbAl').textContent = n; $('#nbAl').classList.toggle('cache', !n);
    } catch (e) { /* sans gravité */ }
  }
  // Même définition que la v16 : absence en attente ou avec réponse reçue, ou alerte à réexaminer.
  const aTraiter = a => !a.annulee && ((a.type === 'absence' && (a.statut === 'attente' || a.statut === 'repondu')) || (a.a_reexaminer && !a.maintenue));

  // ================= Chargement d'une période (pointages, créneaux, congés, corrections) pour le relevé
  async function chargerPeriode(du, au, avecJournal) {
    const [sal, pts, cr, dem] = await Promise.all([
      sb.lire('salaries', { select: '*', etab_id: 'eq.' + etabId, order: 'prenom' }),
      sb.lire('pointages', { select: '*', etab_id: 'eq.' + etabId, and: `(jour.gte.${ajouterJours(du, -1)},jour.lte.${ajouterJours(au, 1)})`, order: 'horodatage', limit: '20000' }),
      sb.lire('creneaux', { select: '*', etab_id: 'eq.' + etabId, supprime: 'eq.false', and: `(jour.gte.${ajouterJours(du, -1)},jour.lte.${ajouterJours(au, 1)})` }),
      sb.lire('demandes', { select: '*', etab_id: 'eq.' + etabId, statut: 'eq.acceptee', du: 'lte.' + au, au: 'gte.' + du })]);
    const corriges = new Map(), motifs = {}, journal = [];
    if (avecJournal) {
      const j = await sb.lire('journal', { select: '*', etab_id: 'eq.' + etabId, objet: 'eq.pointage', le: 'gte.' + ajouterJours(du, -1), order: 'le', limit: '20000' });
      for (const e of j) {
        if (e.action === 'correction' && e.anciennes && !corriges.has(e.objet_id)) corriges.set(e.objet_id, Date.parse(e.anciennes.horodatage));
        if (['correction', 'suppression', 'ajout_manuel'].includes(e.action) && e.motif) motifs[e.objet_id] = e.motif;
        if (e.action !== 'creation') journal.push(e);
      }
    }
    const punches = pts.map(r => R.pointage(r, corriges));
    const ctxR = R.contexte(punches, cr.map(R.creneau), dem.map(R.conge));
    return { sal, pts, cr, dem, ctxR, motifs, journal };
  }

  // ================= Aujourd'hui (v16 : chiffres du jour, équipe du jour, derniers pointages)
  async function vueAujourdhui() {
    const k = aujourdhui();
    const d = await chargerPeriode(ajouterJours(k, -2), k, false);
    const [sem] = await sb.lire('semaines', { select: 'publiee', etab_id: 'eq.' + etabId, lundi: 'eq.' + lundi(k) });
    const dems = await sb.lire('demandes', { select: '*', etab_id: 'eq.' + etabId, statut: 'eq.attente', order: 'du' });
    const als = await sb.lire('alertes', { select: 'id,a_reexaminer,statut,annulee,type,maintenue', etab_id: 'eq.' + etabId, annulee: 'eq.false' });
    const suivi = await sb.lire('sauvegardes_suivi', { select: 'le,type,ok', etab_id: 'eq.' + etabId, type: 'eq.telechargement', order: 'le.desc', limit: '1' });
    const maintenant = Date.now();
    const enService = s => { const l = (d.ctxR.parSal[s.id] || []).filter(p => !p.deleted).slice(-1)[0]; return l && l.t === 'in' && maintenant - l.ts < 16 * 3600e3 ? l : null; };
    let present = 0, retard = 0, manquants = 0, attendus = 0;
    const lignes = [];
    for (const s of d.sal) {
      const sm = R.daySummary(d.ctxR, s.id, k); const now = enService(s);
      if (!sm.sh.length && !sm.pairs.length && !sm.leave) continue;
      if (!s.actif && !sm.pairs.length) continue;
      if (now) present++; if (sm.sh.length) attendus++;
      const debutPasse = sm.sh.length && maintenant > R.instant(k, sm.sh[0].a) + tol() * 60000;
      let chip;
      if (sm.leave) chip = `<span class="etiquette">${esc(sm.leave.type.split(' ')[0])}</span>`;
      else if (now) chip = sm.late > tol() ? `<span class="etiquette alerte">En service · retard ${sm.late} min</span>` : '<span class="etiquette bon">En service</span>';
      else if (sm.pairs.length) chip = sm.incomplete ? '<span class="etiquette alerte">À vérifier</span>' : '<span class="etiquette">Terminé</span>';
      else if (debutPasse) { chip = '<span class="etiquette mauvais">Pas pointé</span>'; manquants++; }
      else chip = '<span class="etiquette">Attendu</span>';
      if (sm.late > tol()) retard++;
      if (!sm.sh.length && sm.pairs.length) chip += ' <span class="etiquette">Hors planning</span>';
      lignes.push(`<tr><td><b>${esc(nomS(s))}</b><br><span class="doux petit">${esc(s.poste || '')}</span></td>
        <td class="nw">${sm.sh.map(x => `${x.a}–${x.b}`).join('<br>') || '<span class="doux">—</span>'}</td>
        <td class="nw num">${sm.pairs.map(x => `${x.in ? R.hm(x.in.ts) : '?'} → ${x.out ? R.hm(x.out.ts) : (x.in && now ? '…' : '?')}`).join('<br>') || '<span class="doux">—</span>'}</td><td>${chip}</td></tr>`);
    }
    const nTraiter = als.filter(aTraiter).length;
    const recents = d.pts.filter(p => !p.supprime).slice().reverse().slice(0, 12);
    const derniere = suivi[0] ? Date.parse(suivi[0].le) : 0;
    $('#vue').innerHTML = `${!d.sal.length ? `<div class="vide">Commencez par ajouter vos salariés dans l'onglet Équipe.</div>` : ''}
      ${maintenant - derniere > 7 * 864e5 ? `<div class="message info">${derniere ? 'Dernière sauvegarde téléchargée le ' + esc(new Date(derniere).toLocaleDateString('fr-FR')) : 'Aucune sauvegarde téléchargée par vous'}. Une sauvegarde automatique est faite chaque nuit ; téléchargez aussi la vôtre au moins chaque semaine (Réglages).</div>` : ''}
      <div class="ligne entre"><h2 style="margin:0;text-transform:capitalize">${esc(dateLongue(k))}</h2><span class="etiquette ${sem && sem.publiee ? 'bon' : 'alerte'}">${sem && sem.publiee ? 'Planning publié' : 'Planning de la semaine non publié'}</span></div>
      <div class="kpis"><div class="kpi"><span class="v">${present}</span><span class="l">en service maintenant</span></div>
        <div class="kpi"><span class="v">${attendus}</span><span class="l">prévus au planning</span></div>
        <div class="kpi ${retard ? 'alerte' : ''}"><span class="v">${retard}</span><span class="l">retards (> ${tol()} min)</span></div>
        <div class="kpi ${manquants ? 'alerte' : ''}"><span class="v">${manquants}</span><span class="l">pas encore pointés</span></div>
        <button class="kpi" data-aller="demandes"><span class="v">${dems.length}</span><span class="l">congés et demandes à valider</span></button>
        <button class="kpi" data-aller="alertes"><span class="v">${nTraiter}</span><span class="l">absences à traiter</span></button></div>
      ${dems.length ? `<div class="carte"><h2>Congés et demandes à valider</h2><ul style="margin:0">${dems.slice(0, 3).map(r => `<li>${esc(nomS(d.sal.find(s => s.id === r.salarie_id)))} · ${esc(r.type)} · ${esc(dateCourte(r.du))}${r.au !== r.du ? ' → ' + esc(dateCourte(r.au)) : ''}</li>`).join('')}</ul>
        ${dems.length > 3 ? `<button class="bouton discret petit" data-aller="demandes">Voir les ${dems.length} demandes</button>` : ''}</div>` : ''}
      <div class="carte"><h2>Équipe du jour</h2>${lignes.length ? `<div class="defile"><table class="tableau"><thead><tr><th>Salarié</th><th>Prévu</th><th>Pointé</th><th>Statut</th></tr></thead><tbody>${lignes.join('')}</tbody></table></div>` : '<div class="vide">Personne n’est prévu aujourd’hui et aucun pointage n’a été fait.</div>'}</div>
      <div class="carte"><h2>Derniers pointages</h2>${recents.length ? `<div class="defile"><table class="tableau"><tbody>${recents.map(p => `<tr><td>${esc(nomS(d.sal.find(s => s.id === p.salarie_id)))}</td><td><span class="etiquette ${p.sens === 'entree' ? 'bon' : 'alerte'}">${p.sens === 'entree' ? 'Entrée' : 'Sortie'}</span></td><td class="num">${p.jour !== k ? esc(dateCourte(p.jour)) + ' · ' : ''}${esc(heure(p.horodatage))}${p.source === 'dirigeant' ? ' <span class="etiquette">manuel</span>' : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="doux petit">Aucun pointage ces trois derniers jours.</p>'}</div>`;
    document.querySelectorAll('[data-aller]').forEach(b => b.onclick = () => choisirOnglet(b.dataset.aller));
  }

  // ================= Relevé des pointages (v16 : période, synthèse, détail jour par jour, corrections, exports, clôture, journal)
  async function vuePointages() {
    const { du, au } = periode;
    const d = await chargerPeriode(du, au, true);
    const ids = new Set([...d.pts.filter(p => p.jour >= du && p.jour <= au).map(p => p.salarie_id), ...d.cr.filter(c => c.jour >= du && c.jour <= au).map(c => c.salarie_id)]);
    const salRapport = d.sal.filter(s => s.actif || ids.has(s.id));
    const choisis = salRapport.filter(s => !filtreSal || s.id === filtreSal);
    const { lignes, sommes } = R.synthese(d.ctxR, choisis, du, au, tol());
    const anomalies = await sb.rpc('controle_journal', { p_etab: etabId, p_du: du, p_au: au });
    const cloture = etab.cloture_jusqu_au;
    const lib = s => `${esc(nomS(s))}${s.actif ? '' : ' <span class="etiquette">parti</span>'}`;
    const t = aujourdhui();
    $('#vue').innerHTML = `<div class="carte pile"><div class="grille2">
        <label class="champ">Du<input type="date" id="du" value="${du}"></label><label class="champ">Au<input type="date" id="au" value="${au}"></label>
        <label class="champ">Salarié<select id="fs"><option value="">Toute l'équipe</option>${salRapport.map(s => `<option value="${s.id}" ${filtreSal === s.id ? 'selected' : ''}>${esc(nomS(s))}${s.actif ? '' : ' (parti)'}</option>`).join('')}</select></label></div>
      <div class="ligne"><button class="bouton discret petit" data-r="semaine">Cette semaine</button><button class="bouton discret petit" data-r="derniere">Semaine dernière</button><button class="bouton discret petit" data-r="mois">Ce mois</button>
        <span style="flex:1"></span><button class="bouton second petit" id="manuel">Ajouter un pointage manuel</button><button class="bouton petit" id="csv">Exporter (CSV)</button><button class="bouton second petit" id="csvd">Détail pour la paie (CSV)</button></div></div>
      <div class="carte"><h2>Synthèse de la période</h2>
      ${sommes.length ? `<div class="defile"><table class="tableau"><thead><tr><th>Salarié</th><th>Jours</th><th>Prévu</th><th>Pointé</th><th>Écart</th><th>Retards</th><th>À vérifier</th></tr></thead><tbody>
      ${sommes.map(x => `<tr><td>${lib(x.s)}</td><td>${x.n}</td><td class="num">${fmtH(x.P)}</td><td class="num"><b>${fmtH(x.W)}</b></td>
        <td class="num" style="color:${x.W - x.P < -15 ? 'var(--mauvais)' : x.W - x.P > 15 ? 'var(--alerte)' : 'var(--doux)'}">${x.W - x.P > 0 ? '+' : ''}${fmtH(x.W - x.P)}</td>
        <td>${x.L ? `<span class="etiquette alerte">${x.L}</span>` : '0'}</td><td>${x.I ? `<span class="etiquette mauvais">${x.I}</span>` : '0'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="doux">Aucun salarié.</p>'}
      ${choisis.length && (au > ajouterJours(du, 6) || lundi(du) !== du) ? `<h3 class="petit">Totaux par semaine (du lundi au dimanche)</h3><div class="defile"><table class="tableau"><thead><tr><th>Salarié</th><th>Semaine</th><th>Prévu</th><th>Pointé</th><th>Écart</th></tr></thead><tbody>
        ${choisis.flatMap(s => R.semaines(d.ctxR, s, du, au).filter(w => w.P || w.W).map(w => `<tr><td>${esc(nomS(s))}</td><td class="nw">du ${esc(dateCourte(w.lundi))}</td><td class="num">${fmtH(w.P)}</td><td class="num">${fmtH(w.W)}</td><td class="num">${w.W - w.P > 0 ? '+' : ''}${fmtH(w.W - w.P)}</td></tr>`)).join('')}</tbody></table></div>` : ''}
      <p class="doux petit" style="margin:0">Heures calculées automatiquement à partir des pointages (entrée → sortie suivante, même passé minuit ; pauses pointées déduites ; heures prévues : pauses prévues déduites). Ce n'est pas un calcul de paie : aucune heure supplémentaire ni majoration n'est calculée. Utilisez l'export CSV dans votre logiciel de paie.</p></div>
      <div class="carte"><h2>Détail jour par jour</h2>
      ${lignes.length ? `<div class="defile"><table class="tableau"><thead><tr><th>Date</th><th>Salarié</th><th>Prévu</th><th>Entrées / sorties</th><th>Pointé</th><th></th></tr></thead><tbody>
      ${lignes.map(({ s, k, sm }) => `<tr><td class="nw">${esc(dateCourte(k))}</td><td>${lib(s)}</td>
        <td class="nw">${sm.leave ? `<span class="etiquette">${esc(sm.leave.type.split(' ')[0])}</span>` : sm.sh.map(x => `${x.a}–${x.b}${x.p ? ` <span class="doux petit">(pause ${x.p} min)</span>` : ''}`).join('<br>') || '<span class="etiquette">Hors planning</span>'}</td>
        <td>${sm.pairs.map(x => `<span class="num">${x.in ? (x.in.date !== k ? esc(dateCourte(x.in.date)) + ' ' : '') + R.hm(x.in.ts) : '<b style="color:var(--mauvais)">??</b>'} → ${x.out ? (x.out.date !== k ? esc(dateCourte(x.out.date)) + ' ' : '') + R.hm(x.out.ts) : '<b style="color:var(--mauvais)">??</b>'}</span>${(x.in && x.in.manual) || (x.out && x.out.manual) ? ' <span class="etiquette">corrigé</span>' : ''}`).join('<br>') || '<span class="etiquette mauvais">Aucun pointage</span>'}
          ${sm.incomplete ? `<br><span class="etiquette mauvais">${sm.long ? 'Durée anormale' : 'Incomplet'}</span>` : ''}${sm.late > tol() ? `<br><span class="etiquette alerte">Retard ${sm.late} min</span>` : ''}</td>
        <td class="num"><b>${fmtH(sm.worked)}</b></td><td><button class="bouton discret petit" data-jour="${k}" data-s="${s.id}">Corriger</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="vide">Aucun créneau ni pointage sur cette période.</div>'}</div>
      <div class="carte pile"><h2 style="margin:0">Journal et historique des corrections</h2>
        ${anomalies.length ? `<div class="message erreur"><b>Journal des pointages : ${anomalies.length} anomalie(s).</b><ul style="margin:6px 0 0">${anomalies.slice(0, 20).map(x => `<li>${esc(dateCourte(x.jour))} · ${esc(nomS(d.sal.find(s => s.id === x.salarie_id)))} · ${x.sens === 'entree' ? 'Entrée' : 'Sortie'} ${esc(heure(x.horodatage))} : ${esc(x.pourquoi)}</li>`).join('')}</ul></div>`
          : '<p class="petit" style="margin:0;color:var(--bon)">Journal des pointages : chaque pointage de la période correspond à son historique.</p>'}
        ${tableJournal(d.journal.filter(e => { const p = d.pts.find(x => x.id === e.objet_id); return p && p.jour >= du && p.jour <= au && (!filtreSal || p.salarie_id === filtreSal); }), d)}</div>
      <div class="carte pile"><h2 style="margin:0">Clôture de la paie</h2>
        <p class="petit doux" style="margin:0">${cloture ? `Période clôturée jusqu'au <b>${esc(R.fNum(cloture))}</b> : les pointages de cette période ne peuvent plus être corrigés sans réouverture.` : 'Aucune période clôturée.'} La clôture et la réouverture sont inscrites au journal et appliquées par la base de données.</p>
        <div class="ligne"><input type="date" id="clDate" style="width:auto" value="${ajouterJours(lundi(t), -1)}"><input type="text" id="clMotif" placeholder="Motif (obligatoire pour rouvrir)" style="flex:1;min-width:180px">
          <button class="bouton petit" id="cloturer">Clôturer jusqu'à cette date</button>${cloture ? '<button class="bouton danger petit" id="rouvrir">Rouvrir</button>' : ''}</div></div>`;
    const recharger = () => afficher();
    $('#du').onchange = e => { periode.du = e.target.value || periode.du; if (periode.au < periode.du) periode.au = periode.du; recharger(); };
    $('#au').onchange = e => { periode.au = e.target.value || periode.au; if (periode.au < periode.du) periode.du = periode.au; recharger(); };
    $('#fs').onchange = e => { filtreSal = e.target.value; recharger(); };
    document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
      const l = lundi(t);
      if (b.dataset.r === 'semaine') periode = { du: l, au: ajouterJours(l, 6) };
      else if (b.dataset.r === 'derniere') periode = { du: ajouterJours(l, -7), au: ajouterJours(l, -1) };
      else { const m = t.slice(0, 7); const fin = new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).toISOString().slice(0, 10); periode = { du: m + '-01', au: fin }; }
      recharger();
    });
    const nomFichier = n => `${n}_${(etab.nom || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').toLowerCase().slice(0, 40)}_${du}_${au}.csv`;
    const ordre = [...choisis].sort((a, b) => (a.prenom || '').localeCompare(b.prenom || '', 'fr'));
    $('#csv').onclick = () => { window.__dernierCsv = R.telecharger(nomFichier('pointages'), R.csvSynthese(d.ctxR, ordre, du, au, tol())); toast('Export téléchargé.'); };

  async function rechargerEtab() { const [e] = await sb.lire('etablissements', { select: '*', id: 'eq.' + etabId }); if (e) etab = e; }
  const ACTIONS = { creation: 'Pointage (tablette)', correction: 'Correction', suppression: 'Suppression', ajout_manuel: 'Ajout manuel', rétablissement: 'Rétablissement', reprise_v8: 'Reprise v8 (état initial)' };
  function tableJournal(liste, d) {

    const f = x => x ? `${x.sens === 'entree' ? 'Entrée' : 'Sortie'} ${x.horodatage ? esc(heure(x.horodatage)) : ''}${x.supprime ? ' (supprimé)' : ''}` : '—';

      ${liste.slice().reverse().map(e => { const p = (e.nouvelles || e.anciennes || {}); return `<tr><td class="nw">${esc(new Date(e.le).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}</td>

        <td class="nw">${f(e.anciennes)}</td><td class="nw">${f(e.nouvelles)}</td><td>${esc(e.motif || '')}</td></tr>`; }).join('')}</tbody></table></div>`;
  }
  // Fenêtre « Corriger » d'une journée : heures modifiables, suppression motivée, rétablissement, ajout d'un pointage oublié.
  async function fenetreJour(sid, k, sal) {
    const s = sal.find(x => x.id === sid);

    const hist = await sb.lire('journal', { select: '*', etab_id: 'eq.' + etabId, objet: 'eq.pointage', objet_id: pts.length ? `in.(${pts.map(p => p.id).join(',')})` : 'eq.00000000-0000-0000-0000-000000000000', order: 'le' });
    const f = fenetre(`<div class="ligne entre"><h2 style="margin:0">${esc(nomS(s))}</h2><button class="bouton discret petit" data-fermer>Fermer</button></div>
      <p class="doux" style="margin:0;text-transform:capitalize">Pointages du ${esc(dateLongue(k))}</p>
      ${pts.length ? pts.map(p => p.supprime ? `<div class="ligne entre" style="opacity:.7"><span><span class="etiquette">${p.sens === 'entree' ? 'Entrée' : 'Sortie'}</span> <s class="num">${esc(heure(p.horodatage))}</s> <span class="etiquette mauvais">supprimé</span></span><button class="bouton discret petit" data-retablir="${p.id}">Rétablir</button></div>`
        : `<div class="ligne entre"><span class="ligne"><span class="etiquette ${p.sens === 'entree' ? 'bon' : 'alerte'}">${p.sens === 'entree' ? 'Entrée' : 'Sortie'}</span><input type="time" value="${esc(heure(p.horodatage))}" data-h="${p.id}" style="width:auto" aria-label="Heure">${p.source === 'dirigeant' || hist.some(e => e.objet_id === p.id && e.action === 'correction') ? '<span class="etiquette">corrigé</span>' : ''}</span>
          <button class="bouton danger petit" data-suppr="${p.id}">Supprimer</button></div>`).join('') : '<p class="doux">Aucun pointage ce jour.</p>'}
      <label class="champ">Motif de la correction (obligatoire)<input type="text" id="motifJ" placeholder="Ex. oubli de badge, heure confirmée par le responsable"></label>
      ${pts.some(p => !p.supprime) ? '<button class="bouton second" id="enrH">Enregistrer les heures modifiées</button>' : ''}
      <h3 style="margin:8px 0 0">Ajouter un pointage oublié</h3>
      <div class="grille2"><label class="champ">Type<select id="tA"><option value="entree">Entrée</option><option value="sortie">Sortie</option></select></label><label class="champ">Heure<input type="time" id="hA"></label></div>
      <button class="bouton" id="ajA">Ajouter</button>
      ${hist.length ? `<details><summary class="petit">Historique de ce jour (${hist.length})</summary>${tableJournal(hist.filter(e => e.action !== 'creation'), { sal })}</details>` : ''}`, true);
    const motif = () => { const m = f.el.querySelector('#motifJ').value.trim(); if (m.length < 3) { toast('Indiquez le motif de la correction.'); return null; } return m; };
    const fini = async () => { f.fermer(); await afficher(); };
    f.el.querySelectorAll('[data-suppr]').forEach(b => b.onclick = async () => { const m = motif(); if (!m) return; try { await sb.rpc('corriger_pointage', { p_id: b.dataset.suppr, p_horodatage: null, p_sens: null, p_supprime: true, p_motif: m }); toast('Pointage supprimé (rétablissable).'); fini(); } catch (e) { toast(messageErreur(e)); } });
    f.el.querySelectorAll('[data-retablir]').forEach(b => b.onclick = async () => { const m = motif(); if (!m) return; try { await sb.rpc('corriger_pointage', { p_id: b.dataset.retablir, p_horodatage: null, p_sens: null, p_supprime: false, p_motif: m }); toast('Pointage rétabli.'); fini(); } catch (e) { toast(messageErreur(e)); } });

    };
    f.el.querySelector('#ajA').onclick = async () => {

    };
  }

  // ================= Planning (v16 : grille, créneaux types, pause, plusieurs jours, copie, contrôles HCR, publication, assistant)
  let IA = { prop: null, consignes: '', mode: 'remplacer' };
  async function vuePlanning() {

      sb.lire('salaries', { select: 'id,prenom,nom,poste,contrat_heures,actif', etab_id: 'eq.' + etabId, actif: 'eq.true', order: 'prenom' }),
      sb.lire('creneaux', { select: '*', etab_id: 'eq.' + etabId, supprime: 'eq.false', and: `(jour.gte.${ajouterJours(semaine, -7)},jour.lte.${ajouterJours(fin, 1)})`, order: 'jour,debut' }),
      sb.lire('demandes', { select: '*', etab_id: 'eq.' + etabId, statut: 'eq.acceptee', du: 'lte.' + fin, au: 'gte.' + ajouterJours(semaine, -1) }),
      sb.lire('semaines', { select: '*', etab_id: 'eq.' + etabId, lundi: 'eq.' + semaine })]);
    const sem = sems[0]; const publiee = !!(sem && sem.publiee);

    const items = cr.map(R.creneau);

      const parJour = [0, 0, 0, 0, 0, 0, 0]; let totSem = 0;
      for (const s of sal) {
        let total = 0;
        g += `<div><b>${esc(s.prenom)}</b> ${esc(s.nom)}<br><span class="doux petit">${esc(s.poste || '')}</span></div>`;
        for (let i = 0; i < 7; i++) {
          const j = ajouterJours(semaine, i);
          const c = its.filter(x => x.s === s.id && x.d === j).sort((a, b) => a.a.localeCompare(b.a));
          c.forEach(x => total += R.shiftMin(x)); if (c.length) parJour[i]++;
          const lv = R.leaveOn({ demandes: dem }, s.id, j);
          g += `<div class="case" ${lecture ? '' : `data-case="${s.id}" data-jour="${j}"`} style="${j === t ? 'background:color-mix(in srgb, var(--accent) 6%, #fff)' : ''}">

            ${c.map(x => `<div class="creneau">${x.a}–${x.b}${x.p ? `<small>pause ${x.p} min</small>` : ''}${x.r && x.r !== s.poste ? `<small>${esc(x.r)}</small>` : ''}${x.n ? `<small>${esc(x.n)}</small>` : ''}</div>`).join('')}
            ${!c.length && !lv ? `<span class="doux petit">${lecture ? 'repos' : '+'}</span>` : ''}</div>`;
        }
        totSem += total;
        const contrat = s.contrat_heures ? Number(s.contrat_heures) * 60 : 0; const ec = total - contrat;
        g += `<div><b>${fmtH(total)}</b>${contrat ? `<br><span class="petit" style="color:${ec > 0 ? 'var(--alerte)' : 'var(--doux)'}">${ec > 0 ? '+' : ''}${fmtH(ec)} / ${+s.contrat_heures}h</span>` : ''}</div>`;
      }
      g += `<div class="doux petit">Personnes</div>` + parJour.map(n => `<div class="doux petit" style="text-align:center">${n}</div>`).join('') + `<div><b>${fmtH(totSem)}</b></div>`;
      return `<div class="carte defile"><div class="grille-planning">${g}</div></div>`;
    };
    const lignesCtrl = l => l.map(c => `<div class="ligne-ia ${c.l}"><b>${c.l === 'bad' ? 'Interdiction' : 'Avertissement'}</b> · ${esc(c.t)}</div>`).join('');
    $('#vue').innerHTML = `<div class="carte pile"><div class="ligne entre"><div class="ligne">
        <button class="bouton discret petit" data-sem="-7" aria-label="Semaine précédente">‹</button><b>Semaine du ${esc(dateCourte(semaine))} au ${esc(dateCourte(fin))}</b>
        <button class="bouton discret petit" data-sem="7" aria-label="Semaine suivante">›</button>${semaine !== lundi(t) ? '<button class="bouton discret petit" data-sem="0">Cette semaine</button>' : ''}</div>
        <span class="etiquette ${publiee ? 'bon' : 'alerte'}">${publiee ? 'Publié aux salariés' : 'Brouillon'}</span></div>
      <div class="ligne"><button class="bouton second petit" id="iaOuvrir">Assistant planning</button><button class="bouton discret petit" id="copier">Copier la semaine précédente</button>
        ${publiee ? '<button class="bouton danger petit" id="depublier">Retirer la publication</button>' : `<button class="bouton petit" id="publier" ${bad ? 'disabled title="Corrigez les interdictions avant de publier"' : ''}>Publier le planning</button>`}</div>
      <p class="doux petit" style="margin:0">${publiee ? 'Semaine visible des salariés, et prise en compte pour les retards et absences.' : 'Brouillon : invisible des salariés, aucune alerte de retard ou d’absence.'} Touchez une case pour ajouter ou modifier un créneau. Une fin plus tôt que le début signifie le lendemain (22:00 → 02:00).</p></div>
      <div id="zoneIA"></div>
      ${grille(items, false)}
      ${checks.length ? `<details class="carte" ${bad ? 'open' : ''}><summary class="ligne" style="cursor:pointer"><b>Contrôles de la semaine (règles HCR)</b>${bad ? `<span class="etiquette mauvais">${bad} interdiction${bad > 1 ? 's' : ''}</span>` : ''}${warn ? `<span class="etiquette alerte">${warn} avertissement${warn > 1 ? 's' : ''}</span>` : ''}</summary>
        <div class="pile" style="gap:6px;margin-top:10px">${lignesCtrl(checks)}</div>
        <p class="doux petit" style="margin:0">${bad ? 'Une semaine comportant une interdiction ne peut pas être publiée. ' : ''}Mêmes contrôles pour la saisie, la copie de semaine, l'assistant et la publication. Niveaux réglables dans Réglages › Règles du planning.</p></details>`
        : '<p class="petit" style="margin:0;color:var(--bon)">Contrôles HCR : aucun point relevé sur cette semaine.</p>'}`;
    document.querySelectorAll('[data-sem]').forEach(b => b.onclick = () => { const d = Number(b.dataset.sem); semaine = d ? ajouterJours(semaine, d) : lundi(aujourdhui()); IA.prop = null; afficher(); });
    const enregistrerSemaine = async (pub) => {
      const ligne = { etab_id: etabId, lundi: semaine, publiee: pub, publiee_le: pub ? new Date().toISOString() : null, publiee_par: pub ? ctx.user.id : null };
      if (sem) await sb.modifier('semaines', { etab_id: 'eq.' + etabId, lundi: 'eq.' + semaine }, ligne); else await sb.ajouter('semaines', ligne);
    };
    const apres = async () => { if (publiee) await sb.rpc('analyser_alertes', { p_etab: etabId }); afficher(); };
    if ($('#publier')) $('#publier').onclick = async () => {
      if (bad) return toast('Publication impossible : corrigez les interdictions.');
      if (warn && !(await formulaire('Publier avec des avertissements ?', [], 'Publier', warn + ' avertissement(s) relevé(s) par les contrôles HCR.'))) return;
      try { await enregistrerSemaine(true); await sb.rpc('analyser_alertes', { p_etab: etabId }); toast('Semaine publiée : visible des salariés.'); afficher(); } catch (e) { toast(messageErreur(e)); }
    };
    if ($('#depublier')) $('#depublier').onclick = async () => {
      if (!(await formulaire('Retirer la publication ?', [], 'Retirer', 'Les salariés ne verront plus cette semaine. Les alertes liées seront réexaminées.'))) return;
      try { await enregistrerSemaine(false); await sb.rpc('analyser_alertes', { p_etab: etabId }); toast('Publication retirée.'); afficher(); } catch (e) { toast(messageErreur(e)); }
    };
    $('#copier').onclick = async () => {

      const nouveaux = prev.map(c => ({ ...R.creneau(c), d: ajouterJours(c.jour, 7) }));

      try { for (const c of prev) await sb.ajouter('creneaux', { etab_id: etabId, salarie_id: c.salarie_id, jour: ajouterJours(c.jour, 7), debut: c.debut, fin: c.fin, pause_min: c.pause_min || 0, poste: c.poste, note: c.note || '', maj_par: ctx.user.id }); toast('Semaine copiée.'); apres(); } catch (e) { toast(messageErreur(e)); }
    };
    // Fenêtre d'une case : créneaux du jour, créneaux types, pause, poste, note, plusieurs jours.
    document.querySelectorAll('[data-case]').forEach(el => el.onclick = () => {
      const s = sal.find(x => x.id === el.dataset.case), j = el.dataset.jour;

      const types = (reg().services_types || []).filter(x => x.n && x.a && x.b);
      const f = fenetre(`<div class="ligne entre"><h2 style="margin:0">${esc(nomS(s))}</h2><button class="bouton discret petit" data-fermer>Fermer</button></div>

      };

      if (z.querySelector('#iaAppliquer')) z.querySelector('#iaAppliquer').onclick = async () => {

      };
    };
    const lancerIA = async (consignes, mode, ajustement) => {
      if (!consignes && !ajustement) return toast('Écrivez ou dictez votre demande.');
      IA.consignes = consignes; IA.mode = mode;
      const etat = $('#iaEtat'); etat.innerHTML = '<div class="message info">Claude prépare le planning… cela prend en général 30 secondes à 2 minutes. Le planning reste modifiable à la main pendant ce temps.</div>';
      document.querySelectorAll('#zoneIA button').forEach(b => b.disabled = true);
      let r;
      try { r = await sb.fonction('planning-ia', { etab_id: etabId, lundi: semaine, consignes, mode, ajustement, proposition_precedente: ajustement && IA.prop ? IA.prop.brut : [] }); }
      catch (e) { document.querySelectorAll('#zoneIA button').forEach(b => b.disabled = false); etat.innerHTML = `<div class="message erreur">${esc(e.code === 'ia_non_configuree' ? 'L’assistant n’est pas encore activé (clé de l’API Claude non installée). Le planning reste modifiable à la main.' : messageErreur(e) + ' Le planning reste modifiable à la main.')}</div>`; return; }
      const nomDe = id => nomS(sal.find(x => x.id === id));
      const lisible = t2 => String(t2).replace(/\bS(\d+)\b/g, m => r.codes && r.codes[m] ? nomDe(r.codes[m]) : m);
      const base = mode === 'completer' ? items : [];
      const nouveaux = r.creneaux.map((c, i) => ({ id: 'ia' + i, s: c.salarie_id, d: c.jour, a: c.debut, b: c.fin, p: c.pause_min || 0, r: c.poste || '', n: '' }));
      const tous = [...base, ...nouveaux];
      IA.prop = { lundi: semaine, mode, items: tous, ajoutes: nouveaux.length, brut: r.creneaux, resume: lisible(r.resume || ''), remarques: (r.remarques || []).map(lisible), questions: (r.questions_ouvertes || []).map(lisible),
        rejetes: (r.rejetes || []).length, usage: r.usage, envoye: r.envoye, checks: R.planChecks(tous, semaine, sal, dem, reg().regles_niveaux, autour, { contractEmpty: true }) };
      panneauIA();
    };
    if (IA.ouvert) panneauIA();
  }
  // Dictée (Chrome, Edge, Safari) ; sinon le micro du clavier de la tablette ou du téléphone.
  function dicter(bouton, cible) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { bouton.classList.add('cache'); return; }
    let rec = null;
    bouton.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = 'fr-FR'; rec.continuous = true; rec.interimResults = false;
      rec.onresult = ev => { let t = ''; for (let i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) t += ev.results[i][0].transcript; if (t) cible.value = (cible.value ? cible.value.trimEnd() + ' ' : '') + t.trim(); };
      rec.onend = () => { rec = null; bouton.textContent = 'Dicter'; };
      rec.onerror = () => toast('Dictée refusée ici : utilisez le micro du clavier.');
      rec.start(); bouton.textContent = '■ Arrêter la dictée';
    };
  }

  // ================= Congés et demandes (v16 : filtres, contexte de la décision, retrait des créneaux, réouverture)

    const lab = { attente: 'À valider', acceptee: 'Validées', refusee: 'Refusées', annulee: 'Annulées', toutes: 'Toutes' };
    const etiq = { attente: '<span class="etiquette alerte">En attente</span>', acceptee: '<span class="etiquette bon">Acceptée</span>', refusee: '<span class="etiquette mauvais">Refusée</span>', annulee: '<span class="etiquette">Annulée par le salarié</span>' };
    const liste = ds.filter(r => filtreDem === 'toutes' || r.statut === filtreDem);
    const periodeTxt = r => (r.au !== r.du ? `du ${dateCourte(r.du)} au ${dateCourte(r.au)}` : `le ${dateCourte(r.du)}`) + (r.debut ? ` · ${hm(r.debut)}–${hm(r.fin)}` : '') + (r.au !== r.du ? ` · ${Math.round((Date.parse(r.au) - Date.parse(r.du)) / 864e5) + 1} jours` : '');

        <span class="num">${esc(periodeTxt(r))}</span>${r.message ? `<span class="doux">« ${esc(r.message)} »</span>` : ''}
        ${docs.filter(x => x.demande_id === r.id).map(lien).join(' ')}

        <span class="doux petit">Envoyée le ${esc(new Date(r.cree_le).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }))}</span>
        <div class="ligne">${r.statut === 'attente' ? `<button class="bouton petit" data-dec="acceptee" data-d="${r.id}">Valider</button><button class="bouton danger petit" data-dec="refusee" data-d="${r.id}">Refuser</button>` : r.statut !== 'annulee' ? `<button class="bouton discret petit" data-dec="attente" data-d="${r.id}">Rouvrir</button>` : ''}</div></div>`).join('')
        : `<div class="vide">${filtreDem === 'attente' ? 'Aucune demande en attente.' : 'Aucune demande.'}</div>`}`;
    brancherDocs();

    document.querySelectorAll('[data-dec]').forEach(b => b.onclick = async () => {
      const r = ds.find(x => x.id === b.dataset.d), v = b.dataset.dec;

      const autres = ds.filter(x => x.id !== r.id && x.salarie_id !== r.salarie_id && x.statut === 'acceptee' && TYPES_CONGE.includes(x.type) && x.du <= r.au && x.au >= r.du);

        ${a.annulee ? `<span class="petit"><span class="doux">Annulée :</span> ${esc(a.motif_annulation || '')}</span>` : ''}
        ${a.a_reexaminer && !a.maintenue && !a.annulee ? `<span class="petit" style="color:var(--alerte)"><b>À réexaminer :</b> ${esc(a.a_reexaminer.pourquoi || '')}. Le salarié a déjà répondu ou une décision a été prise : rien n'a été annulé automatiquement.</span>` : ''}
        ${pl ? `<span class="petit"><span class="etiquette">Demande en attente</span> ${esc(pl.type)} du ${esc(dateCourte(pl.du))}${pl.au !== pl.du ? ' au ' + esc(dateCourte(pl.au)) : ''} : tant qu'elle n'est pas acceptée, l'absence reste à traiter.</span>` : ''}
        ${!a.annulee ? `<div class="ligne">${a.a_reexaminer && !a.maintenue ? `<button class="bouton petit" data-al="annuler" data-a="${a.id}">Annuler la notification</button><button class="bouton discret petit" data-al="maintenir" data-a="${a.id}">Maintenir</button>` : ''}
          ${a.type === 'absence' && a.statut !== 'justifiee' ? `<button class="bouton petit" data-abs="justifiee" data-a="${a.id}">Absence justifiée</button>` : ''}
          ${a.type === 'absence' && a.statut !== 'injustifiee' ? `<button class="bouton danger petit" data-abs="injustifiee" data-a="${a.id}">Non justifiée</button>` : ''}
          ${!(a.a_reexaminer && !a.maintenue) ? `<button class="bouton discret petit" data-al="annuler" data-a="${a.id}">Annuler</button>` : ''}</div>` : ''}</div>`; }).join('')
        : `<div class="vide">${filtreAl === 'traiter' ? 'Aucune absence à traiter.' : 'Rien à afficher.'}</div>`}`;
    brancherDocs();
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filtreAl = b.dataset.f; afficher(); });
    $('#calc').onclick = async () => { try { const r = await sb.rpc('analyser_alertes', { p_etab: etabId }); toast(`Calcul fait : ${r.creees || 0} nouvelle(s), ${r.annulees || 0} annulée(s), ${r.retablies || 0} rétablie(s).`); afficher(); compteurs(); } catch (e) { toast(messageErreur(e)); } };
    document.querySelectorAll('[data-al]').forEach(b => b.onclick = async () => {
      const v = await formulaire(b.dataset.al === 'annuler' ? 'Annuler cette notification' : 'Maintenir cette alerte', [{ id: 'motif', label: 'Motif (obligatoire)', requis: true }], 'Valider', 'Une alerte n’est jamais effacée : elle reste dans l’historique avec son motif.');
      if (!v) return;
      try { await sb.rpc('decider_alerte', { p_alerte: b.dataset.a, p_decision: b.dataset.al, p_motif: v.motif }); toast('Décision enregistrée.'); afficher(); compteurs(); } catch (e) { toast(messageErreur(e)); }
    });
    document.querySelectorAll('[data-abs]').forEach(b => b.onclick = async () => {
      const v = await formulaire(b.dataset.abs === 'justifiee' ? 'Absence justifiée' : 'Absence non justifiée', [{ id: 'c', label: 'Commentaire pour le salarié (facultatif)', type: 'textarea' }], 'Confirmer');
      if (!v) return;
      try { await sb.rpc('decider_absence', { p_alerte: b.dataset.a, p_statut: b.dataset.abs, p_commentaire: v.c }); toast('Décision enregistrée.'); afficher(); compteurs(); } catch (e) { toast(messageErreur(e)); }
    });
  }

  // ================= Messages de la direction (v16 : catégories, destinataires, période, lu par… ; aucun e-mail ni SMS)
  async function vueMessages() {
    const sal = await sb.lire('salaries', { select: 'id,prenom,nom,poste', etab_id: 'eq.' + etabId, actif: 'eq.true', order: 'prenom' });
    const msgs = await sb.lire('messages', { select: '*', etab_id: 'eq.' + etabId, supprime: 'eq.false', order: 'cree_le.desc', limit: '200' });
    const lus = msgs.length ? await sb.lire('messages_lus', { select: 'message_id,salarie_id', message_id: `in.(${msgs.map(m => m.id).join(',')})` }) : [];
    const postes = [...new Set(sal.map(s => s.poste).filter(Boolean))];
    const CATS = ['Information', 'Organisation', 'Planning', 'Fermeture', 'Sécurité', 'Autre'];
    $('#vue').innerHTML = `<form class="carte pile" id="fm"><h2 style="margin:0">Nouveau message</h2>
        <div class="grille2"><label class="champ">Type<select id="mCat">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
        <label class="champ">Destinataires<select id="mDest"><option value="all">Toute l'équipe (${sal.length})</option><option value="sel">Choisir des salariés</option></select></label></div>
        <div id="mSel" class="cache pile" style="gap:6px"><div class="ligne"><span class="doux petit">Sélection rapide :</span>${postes.map(p => `<button type="button" class="bouton discret petit" data-p="${esc(p)}">${esc(p)}</button>`).join('')}<button type="button" class="bouton discret petit" data-p="">Aucun</button></div>
          <div class="jours-coches">${sal.map(s => `<label><input type="checkbox" name="mTo" value="${s.id}" data-poste="${esc(s.poste || '')}"> ${esc(nomS(s))}</label>`).join('')}</div></div>
        <label class="champ">Titre<input type="text" id="mTitre" required maxlength="200" placeholder="Ex. Fermeture exceptionnelle le 1er novembre"></label>
        <label class="champ">Message<textarea id="mCorps" required style="min-height:110px"></textarea></label>
        <div class="grille2"><label class="champ">Période concernée : du (facultatif)<input type="date" id="mDu"></label><label class="champ">au<input type="date" id="mAu"></label></div>
        <p class="doux petit" style="margin:0">Le message apparaît dans les notifications de l'espace salarié. Aucun e-mail ni SMS n'est envoyé.</p>
        <button class="bouton" type="submit">Envoyer le message</button></form>
      <div class="carte"><h2>Messages envoyés</h2>${msgs.length ? msgs.map(m => { const dest = m.destinataires || sal.map(s => s.id); const rd = dest.filter(id => lus.some(l => l.message_id === m.id && l.salarie_id === id));
        return `<div class="pile" style="gap:6px;border-top:1px solid var(--ligne);padding-top:10px;margin-top:10px"><div class="ligne entre"><div class="ligne"><span class="etiquette">${esc(m.categorie)}</span><b>${esc(m.titre)}</b></div><span class="doux petit">${esc(new Date(m.cree_le).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }))}</span></div>
          ${m.du ? `<span class="petit num">${m.au && m.au !== m.du ? `Du ${esc(dateCourte(m.du))} au ${esc(dateCourte(m.au))}` : `Le ${esc(dateCourte(m.du))}`}</span>` : ''}<span style="white-space:pre-wrap">${esc(m.corps)}</span>
          <div class="ligne entre"><span class="doux petit">${m.destinataires ? dest.map(id => esc(nomS(sal.find(s => s.id === id)))).join(', ') : 'Toute l’équipe'} · lu par ${rd.length}/${dest.length}${dest.length - rd.length && dest.length - rd.length <= 6 ? ` (pas encore : ${dest.filter(id => !rd.includes(id)).map(id => esc(nomS(sal.find(s => s.id === id)))).join(', ')})` : ''}</span>
          <button class="bouton discret petit" data-sup="${m.id}">Retirer</button></div></div>`; }).join('') : '<div class="vide">Aucun message envoyé.</div>'}</div>`;
    $('#mDest').onchange = e => $('#mSel').classList.toggle('cache', e.target.value !== 'sel');
    document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => document.querySelectorAll('[name=mTo]').forEach(c => c.checked = !!b.dataset.p && c.dataset.poste === b.dataset.p));
    $('#fm').onsubmit = async e => {
      e.preventDefault();
      const dest = $('#mDest').value === 'all' ? null : [...document.querySelectorAll('[name=mTo]:checked')].map(c => c.value);
      if (dest && !dest.length) return toast('Choisissez au moins un salarié.');
      try { await sb.ajouter('messages', { etab_id: etabId, categorie: $('#mCat').value, titre: $('#mTitre').value.trim(), corps: $('#mCorps').value.trim(), du: $('#mDu').value || null, au: $('#mAu').value || $('#mDu').value || null, destinataires: dest });
        toast('Message envoyé dans les espaces salariés.'); afficher(); } catch (x) { toast(messageErreur(x)); }
    };
    document.querySelectorAll('[data-sup]').forEach(b => b.onclick = async () => { if (!(await formulaire('Retirer ce message ?', [], 'Retirer', 'Il ne sera plus visible des salariés ; il reste dans le journal.'))) return; try { await sb.modifier('messages', { id: 'eq.' + b.dataset.sup }, { supprime: true }); afficher(); } catch (x) { toast(messageErreur(x)); } });
  }

  // ================= Équipe : fiches, comptes, codes de pointage, départs (archivage, historique conservé)
  async function vueEquipe() {
    const sal = await sb.lire('salaries', { select: '*', etab_id: 'eq.' + etabId, order: 'actif.desc,prenom' });
    const mem = await sb.lire('membres', { select: 'salarie_id,actif,role', etab_id: 'eq.' + etabId });
    const avecCode = await sb.rpc('salaries_avec_code', { p_etab: etabId }).catch(() => null);
    const compte = s => { const m = mem.find(x => x.salarie_id === s.id); return !m ? '<span class="etiquette mauvais">aucun compte</span>' : m.actif ? '<span class="etiquette bon">compte actif ou invité</span>' : '<span class="etiquette">compte désactivé</span>'; };
    $('#vue').innerHTML = `<div class="ligne entre"><h2 style="margin:0">Équipe <span class="doux petit">${sal.filter(s => s.actif).length} actifs</span></h2><button class="bouton" id="nouveau">Ajouter un salarié</button></div>
      <div class="carte"><div class="defile"><table class="tableau"><thead><tr><th>Salarié</th><th>Contact</th><th>Poste</th><th>Contrat</th><th>Code</th><th>Compte</th><th>État</th><th></th></tr></thead><tbody>
      ${sal.map(s => `<tr><td><b>${esc(nomS(s))}</b></td><td class="petit">${esc(s.email || '')}<br><span class="doux">${esc(s.telephone || '')}</span></td><td>${esc(s.poste || '')}</td><td class="nw">${s.contrat_heures ? esc(+s.contrat_heures) + ' h / sem.' : '—'}</td>
        <td>${avecCode ? (avecCode.includes(s.id) ? '<span class="etiquette bon">défini</span>' : '<span class="etiquette mauvais">à définir</span>') : ''}</td><td>${compte(s)}</td>
        <td>${s.actif ? '<span class="etiquette bon">Actif</span>' : `<span class="etiquette">Archivé, départ le ${esc(s.depart_le ? R.fNum(s.depart_le) : '?')}</span>`}</td>
        <td><div class="ligne">${s.actif ? `<button class="bouton discret petit" data-a="fiche" data-s="${s.id}">Modifier</button><button class="bouton discret petit" data-a="code" data-s="${s.id}">Code</button>
          <button class="bouton second petit" data-a="inviter" data-s="${s.id}">Inviter par e-mail</button><button class="bouton discret petit" data-a="lien_invitation" data-s="${s.id}">Lien d'activation</button>
          <button class="bouton discret petit" data-a="lien_mot_de_passe" data-s="${s.id}">Lien mot de passe</button><button class="bouton danger petit" data-a="desactiver" data-s="${s.id}">Archiver (départ)</button>`
          : `<button class="bouton second petit" data-a="reactiver" data-s="${s.id}">Réactiver</button>`}</div></td></tr>`).join('')}
      </tbody></table></div><p class="doux petit">Archiver : le salarié ne peut plus pointer ni se connecter. Ses pointages, plannings, demandes et alertes restent dans les tableaux, les exports et le journal.</p>
      <div id="lien" class="message info cache" style="margin-top:12px;word-break:break-all"></div></div>`;
    const champsFiche = s => [
      { id: 'prenom', label: 'Prénom', valeur: s ? s.prenom : '', requis: true }, { id: 'nom', label: 'Nom', valeur: s ? s.nom : '', requis: true },
      { id: 'email', label: 'E-mail (identifiant)', type: 'email', valeur: s ? s.email || '' : '' }, { id: 'telephone', label: 'Téléphone', type: 'tel', valeur: s ? s.telephone || '' : '' },
      { id: 'poste', label: 'Poste', type: 'select', valeur: s ? s.poste || POSTES()[0] : POSTES()[0], options: [...new Set([...POSTES(), ...(s && s.poste ? [s.poste] : [])])].map(p => [p, p]) },
      { id: 'contrat', label: 'Contrat (heures par semaine)', type: 'number', valeur: s ? s.contrat_heures || '' : 35, attr: 'min="0" max="60" step="0.5"' },
      { id: 'dispo', label: 'Disponibilités et préférences (lues par l’assistant planning)', type: 'textarea', valeur: s ? s.disponibilites : '' }];
    const ligneFiche = v => ({ prenom: v.prenom, nom: v.nom, email: v.email || null, telephone: v.telephone || null, poste: v.poste || null, contrat_heures: v.contrat ? Number(v.contrat) : null, disponibilites: v.dispo });
    const genererCode = () => { for (let i = 0; i < 200; i++) { const c = String(1000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 9000)); if (!/^(\d)\1{3}$/.test(c) && !'0123456789'.includes(c) && !'9876543210'.includes(c) && !/^(\d\d)\1$/.test(c)) return c; } return ''; };
    const afficherCode = (s, code) => { const l = $('#lien'); l.classList.remove('cache'); l.innerHTML = code ? `Code de pointage de <b>${esc(s.prenom)}</b> : <b style="font-size:1.3rem;letter-spacing:.2em">${esc(code)}</b><br>Notez-le et remettez-le en main propre : il ne sera plus affiché (il est gardé chiffré).` : 'Code non créé : utilisez le bouton « Code ».'; };
    $('#nouveau').onclick = async () => {
      const v = await formulaire('Nouveau salarié', champsFiche(null), 'Ajouter'); if (!v) return;
      try {
        const [s] = await sb.ajouter('salaries', { etab_id: etabId, ...ligneFiche(v) });
        let code = '', essais = 0; while (!code && essais++ < 5) { const c = genererCode(); try { await sb.rpc('definir_code_pointage', { p_salarie: s.id, p_code: c }); code = c; } catch (e) { /* code déjà pris : un autre */ } }
        await afficher(); afficherCode(s, code);
      } catch (x) { toast(messageErreur(x)); }
    };
    document.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      const a = b.dataset.a, id = b.dataset.s, s = sal.find(x => x.id === id);
      try {
        if (a === 'fiche') {
          const v = await formulaire('Modifier le salarié', champsFiche(s), 'Enregistrer'); if (!v) return;
          await sb.modifier('salaries', { id: 'eq.' + id }, { ...ligneFiche(v), maj_le: new Date().toISOString() }); toast('Fiche enregistrée.'); afficher();
        } else if (a === 'code') {
          const v = await formulaire('Code de pointage de ' + s.prenom, [{ id: 'code', label: 'Nouveau code (4 à 6 chiffres) — laissez vide pour en générer un', type: 'text', attr: 'inputmode="numeric" pattern="[0-9]{4,6}" autocomplete="off"' }], 'Enregistrer',
            'Le code n’est affiché qu’une fois puis gardé chiffré : remettez-le au salarié en main propre. Les codes trop simples ou déjà utilisés sont refusés.');
          if (!v) return; const c = v.code || genererCode(); await sb.rpc('definir_code_pointage', { p_salarie: id, p_code: c }); await afficher(); afficherCode(s, c);
        } else if (a === 'desactiver' || a === 'reactiver') {
          const v = await formulaire(a === 'desactiver' ? 'Archiver ' + s.prenom + ' (départ)' : 'Réactiver ' + s.prenom,
            [...(a === 'desactiver' ? [{ id: 'date', label: 'Date de départ', type: 'date', valeur: aujourdhui(), requis: true }] : []), { id: 'motif', label: 'Motif (obligatoire)', requis: true }], 'Valider',
            a === 'desactiver' ? 'Il ne pourra plus pointer ni se connecter. Ses pointages, plannings et demandes restent dans les tableaux et les exports.' : '');
          if (!v) return;
          await sb.fonction('comptes', { action: a, salarie_id: id, motif: v.motif, depart_le: v.date }); toast(a === 'desactiver' ? 'Salarié archivé, historique conservé.' : 'Accès rétablis.'); afficher();
        } else {
          b.disabled = true;
          const r = await sb.fonction('comptes', { action: a, salarie_id: id, redirect_to: retour() });
          if (a === 'inviter') { toast('Invitation envoyée par e-mail.'); afficher(); }
          else { const l = $('#lien'); l.classList.remove('cache');
            l.innerHTML = `<b>Lien à remettre à ${esc(s.prenom)}</b> (une seule utilisation, durée limitée) :<br><code>${esc(r.lien)}</code><br><button class="bouton petit" id="copier">Copier</button>`;
            $('#copier').onclick = () => navigator.clipboard.writeText(r.lien).then(() => toast('Lien copié.')); }
        }
      } catch (x) { toast(messageErreur(x)); }
      finally { b.disabled = false; }
    });
  }

      <label class="champ">Un salarié pointe à un service mais en manque un autre le même jour
        <select id="parService"><option value="non" ${r.alerte_par_service ? '' : 'selected'}>Aucune alerte s'il y a au moins un pointage dans la journée (comportement des versions précédentes)</option>
        <option value="oui" ${r.alerte_par_service ? 'selected' : ''}>Une alerte pour chaque service sans entrée pointée</option></select></label>
      <p class="doux petit" style="margin:0">Ce choix vous appartient ; la valeur initiale reproduit le comportement des versions précédentes.</p>
      <h2 style="margin:8px 0 0">Règles du planning</h2>
      <p class="doux petit" style="margin:0"><b>Interdiction</b> : l'écran refuse d'enregistrer, de copier, d'appliquer ou de publier. <b>Avertissement</b> : enregistrement possible après confirmation.</p>
      <div class="defile"><table class="tableau"><tbody>${Object.entries(R.RULES).map(([k, x]) => `<tr><td>${esc(x.label)}</td><td style="width:180px"><select id="rl-${k}"><option value="bad" ${(niveaux[k] || x.def) === 'bad' ? 'selected' : ''}>Interdiction</option><option value="warn" ${(niveaux[k] || x.def) === 'warn' ? 'selected' : ''}>Avertissement</option></select></td></tr>`).join('')}</tbody></table></div>
      <h2 style="margin:8px 0 0">Espace salarié</h2>
      <label class="ligne petit"><input type="checkbox" id="espace" ${r.espace_salarie === false ? '' : 'checked'}> Espace salarié activé (désactivé : les salariés ne peuvent plus rien lire ; la base l'applique)</label>
      <div id="msg" class="message cache"></div><button class="bouton" type="submit">Enregistrer les réglages</button></form>
      <div class="carte pile"><h2 style="margin:0">Code de la pointeuse</h2><p class="doux petit" style="margin:0">Ce code permet de quitter le mode pointeuse sur la tablette. ${codeSortie ? '<span class="etiquette bon">défini</span>' : '<span class="etiquette alerte">non défini : la tablette se déconnecte par un appui long de 3 secondes</span>'}</p>
        <div class="ligne"><input type="password" id="cs1" inputmode="numeric" autocomplete="off" placeholder="Nouveau code (4 à 8 chiffres)" style="width:auto"><input type="password" id="cs2" inputmode="numeric" autocomplete="off" placeholder="Confirmation" style="width:auto"><button class="bouton second petit" id="csOk">Changer le code</button></div></div>
      <div class="carte pile"><h2 style="margin:0">Comptes dirigeants</h2><div id="dirs" class="doux petit">Chargement…</div>
        <div class="grille2"><label class="champ">Nom<input type="text" id="dNom"></label><label class="champ">E-mail<input type="email" id="dMail"></label></div>
        <div class="ligne"><button class="bouton second petit" id="dInv">Inviter par e-mail</button><button class="bouton discret petit" id="dLien">Lien d'activation à remettre</button></div><div id="dRes" class="message info cache" style="word-break:break-all"></div></div>
      <form class="carte pile" id="mdp"><h2 style="margin:0">Mon mot de passe</h2><div class="grille2"><label class="champ">Nouveau (10 caractères min., lettres et chiffres)<input type="password" id="mp1" autocomplete="new-password" required></label><label class="champ">Confirmation<input type="password" id="mp2" autocomplete="new-password" required></label></div><button class="bouton second" type="submit">Changer mon mot de passe</button></form>
      <div class="carte pile"><h2 style="margin:0">Sauvegardes</h2><div id="etatSauv" class="doux petit">Chargement…</div>
        <div class="ligne"><button class="bouton second" id="telecharger">Télécharger une sauvegarde complète</button>
        <label class="bouton discret" style="cursor:pointer">Restaurer depuis un fichier…<input type="file" id="fichierRest" accept="application/json,.json" class="cache"></label></div>
        <p class="doux petit" style="margin:0">Le fichier téléchargé contient des données personnelles (salariés, pointages, justificatifs) : rangez-le en lieu sûr. Une restauration commence toujours par une sauvegarde de l’état actuel, et conserve par défaut les pointages enregistrés après la date de la sauvegarde.</p></div>
      <div class="carte pile"><h2 style="margin:0">État du service</h2><div id="etatServ" class="doux petit">Chargement…</div></div>
      <div class="carte pile"><h2 style="margin:0">Installer la pointeuse sur la tablette</h2><ol class="petit doux" style="margin:0">
        <li>Sur la tablette, ouvrez l'adresse du portail et connectez-vous avec le compte de pointage (rôle tablette) de l'établissement.</li>
        <li>Ajoutez la page à l'écran d'accueil et laissez la tablette branchée, ouverte sur la pointeuse.</li>
        <li>L'heure enregistrée est celle du serveur, jamais celle de la tablette. Les absences sont calculées par le serveur, même tablette éteinte.</li>
        <li>Pour quitter le mode pointeuse, touchez « Quitter » en bas de l'écran et saisissez le code de la pointeuse.</li></ol></div>`;
    sb.fonction('sauvegarde', { action: 'etat', etab_id: etabId }).then(e => {
      const d = (e.suivi || []).find(x => x.type === 'automatique');
      $('#etatSauv').innerHTML = (d ? `Dernière sauvegarde automatique : ${esc(new Date(d.le).toLocaleString('fr-FR', { timeZone: 'Europe/Paris' }))} — ${d.ok ? 'réussie' : '<b style="color:var(--mauvais)">échec : ' + esc(d.erreur || '') + '</b>'}` : 'Aucune sauvegarde automatique pour l’instant.')
        + `<br>Copie hors de la base principale : ${e.externe_configure ? 'oui (stockage externe)' : '<b>non configurée</b> (espace privé du projet seulement)'} · chiffrement : ${e.chiffrement_configure ? 'oui' : '<b>non configuré</b>'}`;
    }).catch(x => { $('#etatSauv').textContent = messageErreur(x); });
    sb.rpc('etat_service', { p_etab: etabId }).then(s => {
      const nomT = { 'analyser-alertes': 'Calcul des alertes (toutes les 10 min)', 'sauvegarde-nocturne': 'Sauvegarde de la nuit' };
      const t = (s.taches || []).map(x => `${esc(nomT[x.tache] || x.tache)} : ${x.dernier_passage ? esc(new Date(x.dernier_passage).toLocaleString('fr-FR', { timeZone: 'Europe/Paris' })) + ' — ' + (x.statut === 'succeeded' ? 'réussi' : '<b style="color:var(--mauvais)">' + esc(x.statut || '') + '</b>') : 'pas encore passée'}`).join('<br>');
      const er = (s.dernieres_erreurs || []).slice(0, 5).map(x => `<li>${esc(new Date(x.le).toLocaleString('fr-FR', { timeZone: 'Europe/Paris' }))} · ${esc(x.origine)}${x.page ? ' · ' + esc(x.page) : ''} : ${esc(x.message)}</li>`).join('');
      $('#etatServ').innerHTML = `${t}<br>Échecs des tâches sur 7 jours : ${s.echecs_taches_7j} · erreurs signalées sur 7 jours : ${s.erreurs_7j}` + (er ? `<ul style="margin:.4em 0 0 1.2em;padding:0">${er}</ul>` : '');
    }).catch(x => { $('#etatServ').textContent = messageErreur(x); });
    const chargerDirs = async () => {
      try { const r2 = await sb.fonction('comptes', { action: 'liste_dirigeants', etab_id: etabId });
        $('#dirs').innerHTML = `<div class="defile"><table class="tableau"><thead><tr><th>Nom</th><th>E-mail</th><th>Compte</th><th></th></tr></thead><tbody>${r2.dirigeants.map(x => `<tr><td>${esc(x.nom || '—')}${x.moi ? ' <span class="etiquette bon">vous</span>' : ''}</td><td>${esc(x.email)}</td><td>${!x.actif ? '<span class="etiquette">retiré</span>' : x.active ? '<span class="etiquette bon">Activé</span>' : '<span class="etiquette alerte">Invitation en attente</span>'}</td><td>${x.actif && !x.moi ? `<button class="bouton discret petit" data-retirer="${x.user_id}">Retirer</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
        document.querySelectorAll('[data-retirer]').forEach(b => b.onclick = async () => { const v = await formulaire('Retirer ce dirigeant ?', [{ id: 'motif', label: 'Motif (obligatoire)', requis: true }], 'Retirer'); if (!v) return; try { await sb.fonction('comptes', { action: 'retirer_dirigeant', etab_id: etabId, user_id: b.dataset.retirer, motif: v.motif }); toast('Accès retiré.'); chargerDirs(); } catch (e) { toast(messageErreur(e)); } });
      } catch (e) { $('#dirs').textContent = messageErreur(e); }
    };
    chargerDirs();
    const inviterDir = async action => {
      try { const r2 = await sb.fonction('comptes', { action, etab_id: etabId, email: $('#dMail').value.trim(), nom: $('#dNom').value.trim(), redirect_to: retour() });
        const z = $('#dRes'); z.classList.remove('cache'); z.innerHTML = r2.envoye ? 'Invitation envoyée par e-mail.' : `<b>Lien à remettre</b> (une seule utilisation, durée limitée) :<br><code>${esc(r2.lien || '')}</code>`; chargerDirs();
      } catch (e) { toast(messageErreur(e)); }
    };
    $('#dInv').onclick = () => inviterDir('inviter_dirigeant'); $('#dLien').onclick = () => inviterDir('lien_dirigeant');
    $('#csOk').onclick = async () => { const a = $('#cs1').value, b = $('#cs2').value; if (!/^\d{4,8}$/.test(a)) return toast('4 à 8 chiffres.'); if (a !== b) return toast('Les deux saisies diffèrent.'); try { await sb.rpc('definir_code_sortie', { p_etab: etabId, p_code: a }); toast('Code de la pointeuse changé.'); afficher(); } catch (e) { toast(messageErreur(e)); } };
    $('#mdp').onsubmit = async e => { e.preventDefault(); const pb = P.controleMotDePasse($('#mp1').value, $('#mp2').value); if (pb) return toast(pb); try { await sb.changerMotDePasse($('#mp1').value); toast('Mot de passe changé.'); $('#mdp').reset(); } catch (x) { toast(messageErreur(x)); } };
    $('#telecharger').onclick = async () => {
      try {
        const res = await sb.fonction('sauvegarde', { action: 'telecharger', etab_id: etabId });
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(res.archive)], { type: 'application/json' }));
        a.download = `sauvegarde-${(etab.nom || 'etablissement').replace(/[^\w-]+/g, '-')}-${new Date().toISOString().slice(0, 16).replace(':', 'h')}.json`; a.click();
        toast('Sauvegarde téléchargée.');
      } catch (x) { toast(messageErreur(x)); }
    };
    $('#fichierRest').onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      let archive; try { archive = JSON.parse(await f.text()); } catch (x) { return toast('Fichier illisible.'); }
      if (archive.format !== 'pointeuse-portail') return toast('Ce fichier n’est pas une sauvegarde du portail.');
      const v = await formulaire('Restaurer la sauvegarde du ' + new Date(archive.cree_le).toLocaleString('fr-FR', { timeZone: 'Europe/Paris' }) + ' ?', [
        { id: 'conserver', label: 'Conserver les pointages enregistrés après cette date', type: 'checkbox', valeur: true },
        { id: 'conf', label: 'Tapez RESTAURER pour confirmer', requis: true }], 'Restaurer',
        `Établissement : ${archive.etab && archive.etab.nom}. Salariés, planning, demandes, alertes, messages et justificatifs reviendront à leur état de cette date. Le journal n’est jamais effacé.`);
      if (!v) return;
      if (v.conf !== 'RESTAURER') return toast('Confirmation incorrecte : rien n’a été fait.');
      try {
        const res = await sb.fonction('sauvegarde', { action: 'restaurer', etab_id: etabId, archive, confirmation: 'RESTAURER', conserver_pointages: v.conserver });
        toast(`Restauration faite. Pointages récents conservés : ${res.pointages_recents_conserves}. Fichiers renvoyés : ${res.fichiers.remis}.`); await rechargerEtab(); afficher();
      } catch (x) { toast(messageErreur(x)); }
    };
    $('#fr').onsubmit = async e => {
      e.preventDefault(); const m = $('#msg');
      try {
        const services = [0, 1, 2, 3].map(i => ({ n: $('#tn' + i).value.trim(), a: $('#ta' + i).value, b: $('#tb' + i).value, p: Math.max(0, Math.min(180, +$('#tp' + i).value || 0)) })).filter(x => x.n && x.a && x.b);
        const niv = {}; for (const k of Object.keys(R.RULES)) niv[k] = $('#rl-' + k).value;
        const nv = { ...r, couleur: $('#couleur').value, couleur_titres: $('#couleurT').value, adresse: $('#adresse').value.trim(), code_postal: $('#cp').value.trim(), ville: $('#ville').value.trim(),
          telephone: $('#tel').value.trim(), email: $('#mailE').value.trim(), postes: $('#postes').value.split(',').map(x => x.trim()).filter(Boolean), services_types: services,
          notifier_absences: $('#nAbs').checked, notifier_retards: $('#nRet').checked, modele_retard: $('#mRet').value.trim(), modele_absence: $('#mAbs').value.trim(),
          tolerance_min: Number($('#tol').value || 5), delai_justificatif_h: Number($('#delai').value || 48), alerte_par_service: $('#parService').value === 'oui', regles_niveaux: niv, espace_salarie: $('#espace').checked };
        const f = $('#logoFichier').files[0];
        if (f) nv.logo = await reduireImage(f, 256);
        if ($('#sansLogo') && $('#sansLogo').checked) delete nv.logo;
        const [e2] = await sb.modifier('etablissements', { id: 'eq.' + etabId }, { nom: $('#nom').value.trim(), reglages: nv });
        etab = e2; majEntete(); m.textContent = 'Réglages enregistrés.'; m.className = 'message ok';
      } catch (x) { m.textContent = messageErreur(x); m.className = 'message erreur'; }
    };
  }
  function reduireImage(fichier, taille) {
    return new Promise((ok, ko) => {
      const img = new Image(); const url = URL.createObjectURL(fichier);
      img.onload = () => { const c = document.createElement('canvas'); const k = Math.min(1, taille / Math.max(img.width, img.height));
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); ok(c.toDataURL('image/png')); };
      img.onerror = () => ko(new Error('Image illisible.')); img.src = url;
    });
  }

  async function afficher() {
    try {
      const vues = { aujourdhui: vueAujourdhui, planning: vuePlanning, pointages: vuePointages, demandes: vueDemandes, alertes: vueAlertes, messages: vueMessages, equipe: vueEquipe, journal: vueJournal, reglages: vueReglages };
      await (vues[onglet] || vueAujourdhui)();
    } catch (e) { if (e.statut === 401) return location.replace('index.html?raison=session'); $('#vue').innerHTML = `<div class="message erreur">${esc(messageErreur(e))}</div>`; }
  }
  window.__portail = { aller: choisirOnglet, periode: p => { periode = p; }, semaine: w => { semaine = w; } };
  afficher(); compteurs();
})();
</script>
</body>
</html>
