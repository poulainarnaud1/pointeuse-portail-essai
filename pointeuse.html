<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointeuse — Portail de pointage</title>
<link rel="stylesheet" href="assets/style.css?v=9">
<style>
  body { background: #15120f; color: #f4efe8; }
  .borne { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  .borne header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .borne header h1 { font-size: 1.15rem; margin: 0; flex: 1; }
  .corps { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; padding: 8px 16px 16px; max-width: 1040px; width: 100%; margin: 0 auto; }
  .horloge { text-align: center; }
  .horloge .h { font-size: clamp(3.2rem, 11vw, 7rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .horloge .d { font-size: 1.3rem; text-transform: capitalize; color: #cfc6ba; margin-top: 8px; }
  .clavier { display: grid; gap: 14px; justify-items: center; max-width: 380px; width: 100%; margin: 0 auto; }
  .points { display: flex; gap: 14px; height: 24px; align-items: center; }
  .points i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); }
  .points i.on { background: var(--accent); }
  .touches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
  .touches button { height: clamp(60px, 9vh, 82px); border-radius: 14px; border: 1px solid #3a332b; background: #211d19; color: #f4efe8; font-size: 1.9rem; font-variant-numeric: tabular-nums; cursor: pointer; }
  .touches button.f { font-size: 1rem; color: #cfc6ba; }
  .choix { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
  .choix button { padding: 26px 10px; border-radius: 16px; font-size: 1.5rem; font-weight: 700; border: 2px solid #3a332b; background: #211d19; color: #f4efe8; cursor: pointer; }
  .choix button.sug { border-color: var(--accent); }
  .etat { min-height: 1.5em; text-align: center; font-size: 1.05rem; }
  .etat.ok { color: #7fd19b; } .etat.err { color: #ff8a80; } .etat.att { color: #ffd27f; }
  .pied { display: flex; justify-content: space-between; padding: 8px 16px 14px; color: #a99f92; font-size: .85rem; gap: 10px; flex-wrap: wrap; }
  .photo { position: relative; width: 220px; max-width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid #3a332b; margin: 8px auto 0; background: #000; }
  .photo video { width: 100%; display: block; transform: scaleX(-1); }
  .photo span { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 6px; font-size: .8rem; font-variant-numeric: tabular-nums; }
  .pied button { background: none; border: 1px solid #3a332b; color: #a99f92; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  @media (max-width: 820px) { .corps { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="borne">
  <header><h1 id="nomEtab">Pointeuse</h1><span id="reseau" class="petit"></span></header>
  <div class="corps">
    <div class="horloge"><div class="h" id="h">--:--:--</div><div class="d" id="d"></div><div class="petit" id="presents" style="color:#cfc6ba;margin-top:10px"></div></div>
    <div class="clavier" id="clavier">
      <div id="invite" style="text-transform:uppercase;letter-spacing:.08em;color:#cfc6ba">Tapez votre code</div>
      <div class="points" id="points"></div>
      <div class="touches" id="touches"></div>
      <div id="bonjour" class="cache" style="text-align:center"></div>
      <div id="zonePhoto" class="cache" style="text-align:center"><div class="photo"><video id="video" playsinline muted></video><span id="hPhoto"></span></div>
        <div class="petit" id="infoPhoto" style="color:#a99f92;margin-top:4px"></div></div>
      <div class="choix cache" id="choix">
        <button data-s="entree">ENTRÉE</button><button data-s="sortie">SORTIE</button>
      </div>
      <div class="etat" id="etat" role="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="pied"><span id="ecart">Heure du serveur</span><button id="quitter">Quitter la pointeuse</button></div>
</div>
<script src="assets/config.js?v=9"></script>
<script src="assets/sb.js?v=9"></script>
<script src="assets/commun.js?v=9"></script>
<script>
(async function () {
  const { $, fmt, heure, messageErreur } = P;
  const ctx = await P.garde(['tablette']);
  if (!ctx) return;
  $('#nomEtab').textContent = ctx.etab.nom + ' — pointeuse';

  // Horloge réglée sur l'heure du serveur (l'heure de la tablette n'est jamais utilisée pour enregistrer).
  let decalage = 0;
  async function synchroniser() {
    try {
      const t0 = Date.now(); const s = await sb.rpc('heure_serveur'); const t1 = Date.now();
      decalage = new Date(s).getTime() - (t0 + t1) / 2;
      $('#ecart').textContent = Math.abs(decalage) > 120000 ? 'Attention : l’heure de la tablette est fausse (le pointage utilise l’heure du serveur).' : 'Heure du serveur';
      $('#reseau').textContent = ''; return true;
    } catch (e) { $('#reseau').textContent = 'Hors ligne'; return false; }
  }
  await synchroniser(); setInterval(synchroniser, 5 * 60000);
  setInterval(() => {
    const n = new Date(Date.now() + decalage);
    $('#h').textContent = fmt({ hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(n);
    $('#d').textContent = fmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(n);
  }, 250);

  // Photo au pointage (désactivée par défaut ; activée par le dirigeant avec une raison et une durée de conservation).
  const RG = ctx.etab.reglages || {};
  const PHOTO = !!(RG.photo_active && (RG.photo_raison || '').trim()), PHOTO_OBLIG = PHOTO && !!RG.photo_obligatoire;
  let flux = null;
  async function ouvrirCamera() {
    if (!PHOTO) return;
    $('#zonePhoto').classList.remove('cache');
    $('#infoPhoto').textContent = `Photo prise au moment du pointage (${RG.photo_raison}). Conservée ${RG.photo_conservation_jours || 60} jours, visible du seul dirigeant.`;
    try {
      flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      const v = $('#video'); v.srcObject = flux; await v.play();
    } catch (e) { flux = null; $('#infoPhoto').textContent = 'Caméra indisponible : le pointage sera enregistré sans photo.'; }
  }
  function fermerCamera() { if (flux) flux.getTracks().forEach(t => t.stop()); flux = null; $('#video').srcObject = null; $('#zonePhoto').classList.add('cache'); }
  // Image JPEG (480 px de large) avec l'heure du serveur incrustée, prise à l'instant du choix ENTRÉE / SORTIE.
  async function prendrePhoto() {
    const v = $('#video'); if (!flux || !v.videoWidth) return null;
    const l = 480, h = Math.round(v.videoHeight * l / v.videoWidth), cv = document.createElement('canvas'); cv.width = l; cv.height = h;
    const g = cv.getContext('2d'); g.drawImage(v, 0, 0, l, h);
    const t = fmt({ day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date(Date.now() + decalage));
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, h - 28, l, 28); g.fillStyle = '#fff'; g.font = '16px sans-serif'; g.fillText(t + ' · ' + ctx.etab.nom, 8, h - 9);
    return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.75));
  }
  async function envoyerPhoto(r, image) {
    try {
      const jour = new Date(r.horodatage).toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' });
      await sb.deposer(`${ctx.etab.id}/${jour}/${r.id}.jpg`, image, 'photos');
      await sb.rpc('attacher_photo', { p_id: r.id });
    } catch (e) { sb.rpc('signaler_erreur', { p_page: 'pointeuse.html', p_message: 'photo non envoyée : ' + String(messageErreur(e)).slice(0, 200) }).catch(() => {}); }
  }
  setInterval(() => { if (flux) $('#hPhoto').textContent = heure(new Date(Date.now() + decalage).toISOString()); }, 500);

  // Saisie du code
  let code = '';
  const LONG = 4, MAX = 6;
  const dessinerPoints = () => { $('#points').innerHTML = Array.from({ length: Math.max(LONG, code.length) }, (_, i) => `<i class="${i < code.length ? 'on' : ''}"></i>`).join(''); };
  $('#touches').innerHTML = ['1','2','3','4','5','6','7','8','9','C','0','OK'].map(k => `<button class="${/\d/.test(k) ? '' : 'f'}" data-k="${k}">${k === 'C' ? 'Effacer' : k === 'OK' ? 'Valider' : k}</button>`).join('');
  $('#touches').onclick = e => {
    const k = e.target.dataset.k; if (!k) return;
    if (k === 'C') code = ''; else if (k === 'OK') { if (code.length >= LONG) demanderSens(); } else if (code.length < MAX) code += k;
    dessinerPoints(); etat('');
  };
  addEventListener('keydown', e => { if (/^\d$/.test(e.key) && code.length < MAX) { code += e.key; dessinerPoints(); } else if (e.key === 'Backspace') { code = code.slice(0, -1); dessinerPoints(); } else if (e.key === 'Enter' && code.length >= LONG) demanderSens(); });
  dessinerPoints();

  function etat(t, c) { const e = $('#etat'); e.textContent = t; e.className = 'etat ' + (c || ''); }
  // Présents (prénoms des salariés en service), comme sur la pointeuse de la v16.
  async function presents() { try { const l = await sb.rpc('presents_tablette'); $('#presents').textContent = l.length ? 'En service : ' + l.join(', ') : 'Personne en service pour le moment'; } catch (e) { /* */ } }
  presents(); setInterval(presents, 60000);
  // Écran toujours allumé sur la tablette (comme la v16), quand le navigateur le permet.
  let verrouEcran = null;
  const garderEcran = async () => { try { if ('wakeLock' in navigator && !verrouEcran && document.visibilityState === 'visible') { verrouEcran = await navigator.wakeLock.request('screen'); verrouEcran.addEventListener('release', () => { verrouEcran = null; }); } } catch (e) { /* refusé : sans gravité */ } };
  garderEcran(); document.addEventListener('visibilitychange', garderEcran);
  let ident = null, codeSaisi = '', minuteurAccueil, confirmer = null;
  // 1. Le code est vérifié par le serveur : prénom, service prévu, sens suggéré (rien n'est encore enregistré).
  async function demanderSens() {
    const c = code; code = ''; dessinerPoints();
    etat('Vérification…', 'att');
    try { ident = await sb.rpc('identifier_code', { p_code: c }); } catch (e) { etat('Réseau indisponible : réessayez. ' + messageErreur(e), 'err'); return; }
    if (!ident.ok) { etat(ident.erreur === 'bloque' ? 'Trop de codes faux : réessayez dans ' + ident.attente_s + ' s.' : 'Code incorrect.' + (ident.attente_s ? ' Tablette bloquée ' + ident.attente_s + ' s.' : ''), 'err'); return; }
    codeSaisi = c; etat(''); confirmer = null;
    $('#touches').classList.add('cache'); $('#choix').classList.remove('cache'); $('#bonjour').classList.remove('cache');
    $('#invite').textContent = 'Entrée ou sortie ?';
    $('#bonjour').innerHTML = `<div style="font-size:1.4rem;font-weight:700">Bonjour ${P.esc(ident.prenom)}</div><div class="petit" style="color:#cfc6ba">${ident.conge ? P.esc(ident.conge) + ' aujourd’hui' : ident.prevu ? 'Prévu aujourd’hui : ' + P.esc(ident.prevu) : 'Pas de créneau publié aujourd’hui'}${ident.en_service_depuis ? ' · entré à ' + heure(ident.en_service_depuis) : ''}</div>`;
    document.querySelectorAll('#choix button').forEach(b => b.classList.toggle('sug', b.dataset.s === ident.suggestion));
    clearTimeout(minuteurAccueil); minuteurAccueil = setTimeout(remettre, 25000);
    ouvrirCamera();
  }
  function remettre() { fermerCamera(); code = ''; codeSaisi = ''; ident = null; dessinerPoints(); $('#touches').classList.remove('cache'); $('#choix').classList.add('cache'); $('#bonjour').classList.add('cache'); $('#invite').textContent = 'Tapez votre code'; }
  $('#choix').innerHTML = '<button data-s="entree">ENTRÉE<br><small style="font-weight:400;font-size:.9rem">Je commence</small></button><button data-s="sortie">SORTIE<br><small style="font-weight:400;font-size:.9rem">Je termine</small></button><button data-s="annuler" style="grid-column:1/-1;padding:10px;font-size:1rem;background:none">Annuler</button>'
    + (PHOTO && !PHOTO_OBLIG ? '<label class="petit" style="grid-column:1/-1;color:#cfc6ba;text-align:center"><input type="checkbox" id="sansPhoto"> Pointer sans photo</label>' : '');

  // 2. Envoi : même identifiant pour chaque nouvel essai, donc jamais de doublon même si une réponse s'est perdue.
  $('#choix').onclick = async e => {
    const bt = e.target.closest('button'); if (!bt) return;
    const sens = bt.dataset.s; if (!sens) return; if (sens === 'annuler') { remettre(); return; }
    // même sens que le dernier pointage, il y a moins de 3 minutes : on demande de confirmer (v16)
    if (ident && ident.dernier && ident.dernier.sens === sens && Date.now() + decalage - Date.parse(ident.dernier.horodatage) < 180000 && confirmer !== sens) {
      confirmer = sens; etat(`${sens === 'entree' ? 'Entrée' : 'Sortie'} déjà pointée à ${heure(ident.dernier.horodatage)}. Touchez de nouveau pour confirmer.`, 'att'); return;
    }
    clearTimeout(minuteurAccueil);
    const image = PHOTO && !($('#sansPhoto') && $('#sansPhoto').checked) ? await prendrePhoto().catch(() => null) : null;
    const id = crypto.randomUUID(), c = codeSaisi; remettre();
    etat('Enregistrement…', 'att');
    const fin = Date.now() + 120000; let r = null, derniere = null;
    while (Date.now() < fin) {
      try { r = await sb.rpc('pointer', { p_id: id, p_code: c, p_sens: sens }); break; }
      catch (er) { derniere = er; if (er.statut && er.statut < 500 && er.statut !== 408) break; etat('Réseau indisponible : nouvel essai en cours… ne partez pas.', 'att'); await new Promise(z => setTimeout(z, 4000)); }
    }
    if (!r) { etat('POINTAGE NON ENREGISTRÉ (' + messageErreur(derniere) + '). Réessayez ou prévenez votre responsable.', 'err'); return; }
    if (!r.ok) {
      if (r.erreur === 'bloque') etat('Trop de codes faux : réessayez dans ' + r.attente_s + ' s.', 'err');
      else etat('Code incorrect.' + (r.attente_s ? ' Tablette bloquée ' + r.attente_s + ' s.' : ''), 'err');
      return;
    }
    const h = heure(r.horodatage);
    if (r.doublon) etat(`${r.prenom || ''} : déjà pointé à ${h} (moins de 2 minutes). Rien de plus n'est enregistré.`, 'att');
    else etat(r.sens === 'entree' ? `Entrée enregistrée à ${h}. Bon service, ${r.prenom || ''} !` : `Sortie enregistrée à ${h}. Merci et bonne fin de journée, ${r.prenom || ''}.`, 'ok');
    presents();
    if (image && !r.doublon) envoyerPhoto(r, image);
    setTimeout(() => etat(''), 8000);
  };

  // Quitter le mode pointeuse : code de la pointeuse (vérifié par le serveur). Sans code défini : appui maintenu 3 secondes.
  let minuteur;
  const q = $('#quitter');
  q.onclick = async () => {
    const v = await P.formulaire('Quitter la pointeuse', [{ id: 'c', label: 'Code de la pointeuse', type: 'password', attr: 'inputmode="numeric" autocomplete="off"' }], 'Quitter', 'Si aucun code n’a été défini par le dirigeant, laissez vide.');
    if (!v) return;
    try { const r = await sb.rpc('verifier_code_sortie', { p_code: v.c || '' });
      if (r.ok && r.sans_code) { etat('Aucun code défini : maintenez le bouton « Quitter » 3 secondes.', 'att'); return; }
      if (!r.ok) { etat(r.erreur === 'bloque' ? 'Trop d’essais : patientez ' + r.attente_s + ' s.' : 'Code de la pointeuse incorrect.', 'err'); return; }
      await sb.deconnexion(); location.replace('index.html');
    } catch (e) { etat(messageErreur(e), 'err'); }
  };
  q.onpointerdown = () => { minuteur = setTimeout(async () => { try { const r = await sb.rpc('verifier_code_sortie', { p_code: '' }); if (r.ok && r.sans_code) { await sb.deconnexion(); location.replace('index.html'); } } catch (e) { /* */ } }, 3000); };
  q.onpointerup = q.onpointerleave = () => clearTimeout(minuteur);
})();
</script>
</body>
</html>
